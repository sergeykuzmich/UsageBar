name: build

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name for the uploaded application artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build arm64 app
        run: make build

      - name: Package app
        run: ditto -c -k --keepParent dist/UsageBar.app dist/UsageBar.zip

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/UsageBar.zip
          if-no-files-found: error
          retention-days: 7
