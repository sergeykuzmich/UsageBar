name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - run: swift test

      - name: Build the app bundle
        run: USAGEBAR_VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh --universal

      - name: Package
        # ditto keeps the ad-hoc code signature intact; `zip` would not.
        run: ditto -c -k --keepParent dist/UsageBar.app dist/UsageBar.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/UsageBar.zip --generate-notes --title "$GITHUB_REF_NAME"
